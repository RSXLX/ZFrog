# ZFrog 微服务架构 Docker Compose (P2/P3 部署配置)
version: '3.8'

services:
  # API Gateway (入口)
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - TRAVEL_SERVICE_URL=http://travel-service:3001
      - WALLET_SERVICE_URL=http://wallet-service:3002
      - AI_SERVICE_URL=http://ai-service:3003
      - NFT_SERVICE_URL=http://nft-service:3004
      - BADGE_SERVICE_URL=http://badge-service:3005
      - JWT_SECRET=${JWT_SECRET}
      - RATE_LIMIT_WINDOW=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      - redis
      - travel-service
      - wallet-service
      - ai-service
      - nft-service
      - badge-service
    networks:
      - zfrog-network
    restart: unless-stopped

  # Travel Service (旅行管理)
  travel-service:
    build:
      context: ./microservices/travel-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - RPC_URL=${RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - CONTRACT_ADDRESS=${TRAVEL_CONTRACT_ADDRESS}
    depends_on:
      - postgres
      - redis
    networks:
      - zfrog-network
    restart: unless-stopped

  # Wallet Observer (钱包观察)
  wallet-service:
    build:
      context: ./microservices/wallet-observer
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - REDIS_URL=redis://redis:6379
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - BSCSCAN_API_KEY=${BSCSCAN_API_KEY}
      - POLYGONSCAN_API_KEY=${POLYGONSCAN_API_KEY}
      - ARBISCAN_API_KEY=${ARBISCAN_API_KEY}
      - OPTIMISTIC_API_KEY=${OPTIMISTIC_API_KEY}
      - ZETACHAIN_RPC=${ZETACHAIN_RPC}
    depends_on:
      - redis
    networks:
      - zfrog-network
    restart: unless-stopped

  # AI Service (AI生成)
  ai-service:
    build:
      context: ./microservices/ai-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - DEFAULT_MODEL=gpt-4
      - FALLBACK_MODEL=qwen-turbo
      - MAX_CONCURRENT_REQUESTS=10
      - REQUEST_TIMEOUT=30000
    depends_on:
      - redis
    networks:
      - zfrog-network
    restart: unless-stopped

  # NFT Service (NFT管理)
  nft-service:
    build:
      context: ./microservices/nft-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - RPC_URL=${RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - SOUVENIR_CONTRACT=${SOUVENIR_CONTRACT}
      - FROG_CONTRACT=${FROG_CONTRACT}
      - IPFS_PINATA_API_KEY=${IPFS_PINATA_API_KEY}
      - IPFS_PINATA_SECRET=${IPFS_PINATA_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - zfrog-network
    restart: unless-stopped

  # Badge Service (徽章系统)
  badge-service:
    build:
      context: ./microservices/badge-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - REWARD_CONTRACT=${REWARD_CONTRACT}
      - MAX_PROGRESS_CACHE=10000
      - PROGRESS_SYNC_INTERVAL=60000
    depends_on:
      - postgres
      - redis
    networks:
      - zfrog-network
    restart: unless-stopped

  # 数据库
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - zfrog-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - zfrog-network
    restart: unless-stopped

  # Nginx 反向代理 (生产环境)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - zfrog-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  zfrog-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
