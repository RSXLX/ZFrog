name: v2-dual-entry-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/v2-dual-entry-smoke.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/v2-dual-entry-smoke.yml'

jobs:
  legacy-smoke:
    name: Legacy Entry Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install
        run: npm ci --prefix backend

      - name: Frontend install
        run: npm ci --prefix frontend

      - name: Legacy smoke
        run: |
          npm --prefix backend run db:generate
          npm --prefix backend run build
          npm --prefix frontend run test -- --passWithNoTests

  workspace-smoke:
    name: Workspace Entry Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies (workspace)
        run: pnpm install --no-frozen-lockfile

      - name: Workspace smoke
        run: |
          pnpm --filter ./backend run db:generate
          pnpm --filter ./backend build
          pnpm --filter ./frontend test -- --passWithNoTests
